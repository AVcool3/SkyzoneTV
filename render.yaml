# One-click Render deploy: render.com -> New -> Blueprint -> pick this repo.
# Gives you HTTPS, a permanent URL, auto-deploy on every push, and a
# persistent disk for uploaded media + settings.
services:
  - type: web
    # NOTE: this is the Render service identity (and the *.onrender.com URL).
    # It predates the ParkCast rename — do NOT change it: Render treats a new
    # name as a NEW service, orphaning the existing disk and data. Renaming
    # is a manual Render-dashboard operation, done deliberately.
    name: skyzone-tv
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    plan: starter
    disk:
      name: skyzone-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: DATA_DIR
        value: /data
      - key: REQUIRE_TV_APPROVAL
        value: "1"
