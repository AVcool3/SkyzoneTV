# One-click Render deploy: render.com -> New -> Blueprint -> pick this repo.
# Gives you HTTPS, a permanent URL, auto-deploy on every push, and a
# persistent disk for uploaded media + settings.
services:
  - type: web
    # Renamed from skyzone-tv (Sept 2026). Render provisions this as a NEW
    # service with a fresh disk; the old skyzone-tv service keeps its data
    # until deleted from the Render dashboard. Set ADMIN_PASSWORD (and any
    # ROLLER_*/VENUE_NAME vars) on the new service before switching TVs over.
    name: parkcast
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    plan: starter
    disk:
      name: parkcast-data
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: DATA_DIR
        value: /data
      - key: REQUIRE_TV_APPROVAL
        value: "1"
