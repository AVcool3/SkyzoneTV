# CI: every push runs the byline unit tests and the full smoke suite against
# a freshly booted server. Enable "Wait for CI to pass before deploying" on
# the Render service so a red run here blocks the production deploy.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Byline parser unit tests
        run: node scripts/test-byline.js
      - name: Store migration unit tests
        run: node scripts/test-migrate.js
      - name: Boot server and run smoke suite (LAN mode)
        run: |
          ADMIN_PASSWORD=ci-smoke DATA_DIR=/tmp/ci-data node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/healthz > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8080/healthz
          ADMIN_PASSWORD=ci-smoke node scripts/smoke.js
          kill $SERVER_PID
      - name: Boot server and run pairing suite (cloud mode, as production runs)
        run: |
          ADMIN_PASSWORD=ci-claim DATA_DIR=/tmp/ci-claim REQUIRE_TV_APPROVAL=1 PORT=8081 node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fs http://localhost:8081/healthz > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8081/healthz
          BASE_URL=http://localhost:8081 node scripts/smoke-claim.js
          kill $SERVER_PID
